name: SILIMU — APK Android

# Compile l'application Flutter et publie automatiquement l'APK
# dans l'onglet Releases, téléchargeable par tout le monde.
on:
  push:
    branches: [main]
    paths:
      - 'mobile_app/**'
      - 'android_shell/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: silimu-apk
  cancel-in-progress: false

jobs:
  build:
    name: Compiler et publier l'APK
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Générer la base du projet
        run: |
          flutter create \
            --org cd.silimu \
            --project-name silimu_app \
            --platforms=android,web \
            mobile_app_tmp

      - name: Injecter le code de l'application
        run: |
          rm -rf mobile_app_tmp/lib mobile_app_tmp/test mobile_app_tmp/analysis_options.yaml
          cp -r mobile_app/lib mobile_app_tmp/lib
          cp -r mobile_app/test mobile_app_tmp/test
          cp -r mobile_app/assets mobile_app_tmp/assets
          cp mobile_app/pubspec.yaml mobile_app_tmp/pubspec.yaml
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' \
            mobile_app_tmp/android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="SILIMU"|' \
            mobile_app_tmp/android/app/src/main/AndroidManifest.xml

      - name: Installer le logo et les icônes SILIMU
        run: |
          RES=mobile_app_tmp/android/app/src/main/res
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp mobile_app/assets/android/$d/*.png "$RES/$d"/
          done
          mkdir -p "$RES/mipmap-anydpi-v26"
          cp mobile_app/assets/android/mipmap-anydpi-v26/*.xml "$RES/mipmap-anydpi-v26/"
          cp mobile_app/assets/android/drawable/ic_launcher_background.xml "$RES/drawable/"
          # Écran de démarrage aux couleurs de SILIMU
          find mobile_app_tmp/android/app/src/main/res -name 'launch_background.xml' \
            -exec sed -i 's|@android:color/white|#07303F|g' {} +
          # Icônes et manifeste de la version web
          cp mobile_app/assets/icon-192.png mobile_app_tmp/web/icons/Icon-192.png
          cp mobile_app/assets/icon-512.png mobile_app_tmp/web/icons/Icon-512.png
          cp mobile_app/assets/icon-192.png mobile_app_tmp/web/icons/Icon-maskable-192.png
          cp mobile_app/assets/icon-512.png mobile_app_tmp/web/icons/Icon-maskable-512.png
          cp mobile_app/assets/favicon-32.png mobile_app_tmp/web/favicon.png
          sed -i 's|silimu_app|SILIMU|g' mobile_app_tmp/web/manifest.json
          sed -i 's|#0175C2|#07303F|g' mobile_app_tmp/web/manifest.json
          sed -i 's|silimu_app|SILIMU|g' mobile_app_tmp/web/index.html

      - name: Installer les dépendances
        run: flutter pub get
        working-directory: mobile_app_tmp

      - name: Analyser le code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: mobile_app_tmp

      - name: Lancer les tests
        run: flutter test
        working-directory: mobile_app_tmp

      - name: Compiler les APK
        run: |
          flutter build apk --release --split-per-abi --obfuscate \
            --split-debug-info=build/symbols
        working-directory: mobile_app_tmp

      - name: Préparer les fichiers à publier
        run: |
          cd mobile_app_tmp/build/app/outputs/flutter-apk
          # Un fichier par architecture : 3x plus léger qu'un APK universel
          cp app-arm64-v8a-release.apk   SILIMU.apk        # 95 % des téléphones
          cp app-armeabi-v7a-release.apk SILIMU-arm32.apk # téléphones anciens
          cp app-x86_64-release.apk       SILIMU-emu.apk   # émulateurs
          ls -lh SILIMU*.apk

      - name: Compiler l'APK léger (2 Mo)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer l'APK léger
        run: |
          # Icônes SILIMU dans le projet Android minimal
          cp -r mobile_app/assets/android/drawable android_shell/app/src/main/res/
          cp -r mobile_app/assets/android/mipmap-* android_shell/app/src/main/res/
          # Clé de signature stable (générée une seule fois, conservée pour que
          # les mises à jour s'installent par-dessus l'application existante)
          if [ ! -f android_shell/app/silimu.keystore ]; then
            keytool -genkeypair -v -keystore android_shell/app/silimu.keystore \
              -storepass silimu -keypass silimu -alias silimu \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=SILIMU, OU=SILIMU, O=SILIMU, L=Bukavu, C=CD"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android_shell/app/silimu.keystore
            git commit -q -m "Cle de signature Android (developpement)" || true
            git push || true
          fi
          # Gradle
          if ! command -v gradle >/dev/null 2>&1; then
            curl -sSL -o /tmp/gradle.zip \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip
            sudo unzip -q -o /tmp/gradle.zip -d /opt
            echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
            export PATH="/opt/gradle-8.9/bin:$PATH"
          fi
          if ! [ -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms/android-34" ]; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          gradle -p android_shell assembleRelease --no-daemon -q
          ls -lh android_shell/app/build/outputs/apk/release/
          cp android_shell/app/build/outputs/apk/release/app-release.apk \
            mobile_app_tmp/SILIMU-leger.apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile_app_tmp/build/app/outputs/flutter-apk/SILIMU*.apk
            mobile_app_tmp/SILIMU-leger.apk
          name: SILIMU 1.0.0
          tag_name: v1.0.0
          overwrite_files: true
          body: |
            ### SILIMU 1.0.0

            Application de réservation de billets de transport lacustre (lac Kivu / Tanganyika).

            **Télécharger la version légère (2 Mo) :**
            [SILIMU-leger.apk](https://github.com/davidbafulwa/silimu-app/releases/latest/download/SILIMU-leger.apk)

            | Fichier | Pour qui | Taille |
            |---|---|---|
            | **SILIMU-leger.apk** | Téléphones Android — à privilégier | ~2 Mo |
            | SILIMU.apk | Version complète hors ligne (téléphones récents) | ~16 Mo |
            | SILIMU-arm32.apk | Version complète (téléphones anciens) | ~13 Mo |
            | SILIMU-emu.apk | Version complète (émulateurs) | ~17 Mo |

            La version légère affiche le site SILIMU : elle s'installe en quelques
            secondes même avec une connexion lente. Au premier lancement, elle
            demande l'adresse du serveur SILIMU (ex. `http://192.168.1.10:8000`).

            Installation : activez « Sources inconnues », puis ouvrez le fichier.
